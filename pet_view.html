<!DOCTYPE html><html><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Pet</title><body style="font-family:sans-serif;background:#f4f6f8;color:#222;margin:0;padding:0">
<div style="background:linear-gradient(135deg,#FF5A5F,#FF8A8E);padding:20px 16px;text-align:center;color:#fff"><div id=e style="font-size:36px">🐾</div><h1 id=n style="margin:4px 0 0;font-size:20px">Pet</h1><div id=s style="font-size:11px;color:rgba(255,255,255,.7)">VVU</div></div>
<div id=x style="padding:10px"></div>
<div style="text-align:center;padding:12px;font-size:9px;color:#aaa"><b style="color:#FF5A5F">VVU</b> — Sri Venkateswara Veterinary University</div>
<script>
function e2(s){switch((s||'').toLowerCase()){case'dog':return'🐕';case'cat':return'🐈';default:return'🐾'}}
function h(s){return s?document.createElement('div').appendChild(document.createTextNode(s)).parentNode.innerHTML:''}
function R(p){
  document.getElementById('e').textContent=e2(p.species);
  document.getElementById('n').textContent=p.petName||'Pet';
  document.getElementById('s').textContent='Case: '+(p.caseNo||'')+' · VVU';
  var o='<div style="background:#fff;border-radius:10px;margin:0 0 10px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:32px">'+e2(p.species)+'</div><div><b style="font-size:17px">'+h(p.petName)+'</b><br><span style="font-size:12px;color:#767676">'+[p.species,p.breed].filter(Boolean).join(' · ')+'</span></div></div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">';
  if(p.age)o+='<span style="background:#FFF0EF;color:#FF5A5F;font-size:10px;padding:2px 7px;border-radius:10px">📅 '+h(p.age)+'</span>';
  if(p.sex)o+='<span style="background:#FFF0EF;color:#FF5A5F;font-size:10px;padding:2px 7px;border-radius:10px">'+(p.sex=='Male'?'♂️':'♀️')+' '+h(p.sex)+'</span>';
  if(p.weight)o+='<span style="background:#FFF0EF;color:#FF5A5F;font-size:10px;padding:2px 7px;border-radius:10px">⚖️ '+h(p.weight)+' kg</span>';
  o+='</div></div>';
  function S(t){o+='<div style="margin:0 0 8px"><b style="font-size:13px;color:#FF5A5F;margin-bottom:4px;display:block">● '+t+'</b><div style="background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.03)">'}
  function R2(l,v){if(v)o+='<div style="padding:3px 0;border-bottom:1px solid #eee;font-size:12px;display:flex"><span style="width:80px;color:#767676;flex-shrink:0">'+l+'</span><span style="font-weight:500">'+h(v)+'</span></div>'}
  function E(){o+='</div></div>'}
  if(p.diagnosis||p.treatment||p.vetNotes){S('Dx & Tx');R2('Diagnosis',p.diagnosis);R2('Treatment',p.treatment);R2('Notes',p.vetNotes);R2('Follow-up',p.followUpDate);E()}
  if(p.medicationEntries&&p.medicationEntries.length){S('Meds');for(var i=0;i<p.medicationEntries.length;i++){var m=p.medicationEntries[i];if(m.drug)o+='<div style="padding:3px 0;border-bottom:1px solid #eee;font-size:12px"><b>'+h(m.drug)+'</b> '+[m.dosage,m.frequency,m.route,m.duration].filter(Boolean).join(' · ')+'</div>'}E()}
  if(p.temperature||p.presentingComplaint){S('Clinical');R2('Temp',p.temperature);R2('Complaint',p.presentingComplaint);R2('History',p.history);E()}
  if(p.ownerName||p.date){S('Receipt');R2('Date',p.date);R2('Owner',p.ownerName);R2('Location',p.location);if(p.registrationFee)o+='<div style="padding:3px 0;font-size:12px;display:flex"><span style="width:80px;color:#767676;flex-shrink:0">Fee</span><span style="font-weight:600;color:#FF5A5F">₹'+h(p.registrationFee)+'</span></div>';E()}
  document.getElementById('x').innerHTML=o}
try{var w=window.location.hash.replace(/^#/,'');if(!w)document.getElementById('x').innerHTML='<div style="text-align:center;padding:30px;color:#999"><div style="font-size:40px">🔍</div><h3 style="color:#555">Scan a VVU pet QR</h3></div>';else R(JSON.parse(decodeURIComponent(atob(w))))}
catch(e){document.getElementById('x').innerHTML='<div style="text-align:center;padding:30px;color:#999"><div style="font-size:40px">⚠️</div><h3 style="color:#D32F2F">Invalid QR</h3></div>'}
</script>
